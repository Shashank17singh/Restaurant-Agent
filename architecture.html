<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture - Restaurant Agent</title>
              <meta name="color-scheme" content="dark">
  <meta name="darkreader-lock">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono&family=Geist:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap');
    
    :root {
      color-scheme: dark;
      --bg-body: #050505;
      --bg-container: #0a0a0a;
      --node-fill: #171717;
      --node-stroke: #404040;
      --node-text: #f5f5f5;
      --node-sub: #a3a3a3;
      --edge-stroke: #525252;
      --edge-text: #a3a3a3;
      --hover-node-stroke: #a3a3a3;
      --hover-node-fill: #262626;
      --hover-edge: #d4d4d4;
    }

    body { 
      margin: 0; 
      padding: 2rem; 
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; 
      background-color: var(--bg-body); 
      color: var(--node-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .diagram-container { 
      width: 100%; 
      max-width: 1200px;
      overflow-x: auto; 
      background-color: var(--bg-container); 
      border: 1px solid #262626; 
      border-radius: 12px; 
      padding: 3rem; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    
    svg { 
      width: 100%; 
      min-width: 960px; 
      display: block; 
    }

    .node rect { 
      fill: var(--node-fill); 
      stroke: var(--node-stroke); 
      stroke-width: 1.5; 
      rx: 6; 
      transition: all 0.2s ease;
    }
    .node:hover rect {
      stroke: var(--hover-node-stroke);
      fill: var(--hover-node-fill);
    }
    
    .node text { 
      fill: var(--node-text); 
      font-size: 10px; 
      font-weight: 600; 
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
    }
    .node .sub { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 7.5px; 
      font-weight: normal; 
      fill: var(--node-sub); 
    }
    .node:hover text {
      fill: #ffffff;
    }
    .node:hover .sub {
      fill: #d4d4d4;
    }
    
    .edge path { 
      fill: none; 
      stroke: var(--edge-stroke); 
      stroke-width: 1.5; 
      transition: all 0.2s ease;
    }
    .edge:hover path {
      stroke: var(--hover-edge);
      stroke-width: 2;
    }
    
    .edge text { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 8px; 
      fill: var(--edge-text); 
      paint-order: stroke fill;
      stroke: var(--bg-container);
      stroke-width: 8px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    
    .title { 
      font-family: 'Instrument Serif', Georgia, serif; 
      font-size: 26px; 
      fill: var(--node-text); 
    }
    .subtitle { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 9px; 
      fill: #737373; 
    }
    
    .zone { 
      fill: rgba(255,255,255,0.02); 
      stroke: rgba(255,255,255,0.1); 
      stroke-width: 1; 
      rx: 8; 
    }
    .zone-label { 
      font-family: 'Geist Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 7px; 
      fill: rgba(255,255,255,0.4); 
      letter-spacing: 0.14em; 
    }

    @keyframes flow {
      to { stroke-dashoffset: -20; }
    }
    .edge path[stroke-dasharray] {
      animation: flow 1.5s linear infinite;
      stroke: var(--node-sub);
    }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
      <title id="title">Restaurant Agent Architecture</title>
      <desc id="desc">LangGraph Agentic ordering system</desc>
      
                                    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252" style="fill: context-stroke;" />
        </marker>
      </defs>

      <text x="40" y="60" class="title">Restaurant Agent</text>
      <text x="40" y="80" class="subtitle">LangGraph + FastAPI AI Ordering Workflow</text>

      <!-- Zones -->
      <rect x="40" y="120" width="240" height="400" class="zone" />
      <text x="50" y="135" class="zone-label">CLIENT INTERFACE</text>

      <rect x="320" y="120" width="240" height="400" class="zone" />
      <text x="330" y="135" class="zone-label">FASTAPI & GRAPH STATE</text>

      <rect x="600" y="120" width="280" height="400" class="zone" />
      <text x="610" y="135" class="zone-label">AGENT TOOL NODES</text>

      <!-- Nodes -->
      <g class="node" transform="translate(80, 270)">
        <rect x="0" y="0" width="160" height="60" />
        <text x="80" y="25" text-anchor="middle" >User Chat</text>
        <text x="80" y="40" class="sub" text-anchor="middle" >Streamlit UI</text>
      </g>

      <g class="node" transform="translate(360, 200)">
        <rect x="0" y="0" width="160" height="60" />
        <text x="80" y="25" text-anchor="middle" >LangGraph State</text>
        <text x="80" y="40" class="sub" text-anchor="middle" >MemorySaver</text>
      </g>
      <g class="node" transform="translate(360, 340)">
        <rect x="0" y="0" width="160" height="60" />
        <text x="80" y="25" text-anchor="middle" >LLM Brain Node</text>
        <text x="80" y="40" class="sub" text-anchor="middle" >Groq (gpt-oss-120b)</text>
      </g>

      <g class="node" transform="translate(660, 160)">
        <rect x="0" y="0" width="160" height="60" />
        <text x="80" y="25" text-anchor="middle" >Order Confirm Node</text>
        <text x="80" y="40" class="sub" text-anchor="middle" >Inventory Check</text>
      </g>
      <g class="node" transform="translate(660, 270)">
        <rect x="0" y="0" width="160" height="60" />
        <text x="80" y="25" text-anchor="middle" >Cook Node</text>
        <text x="80" y="40" class="sub" text-anchor="middle" >Prepare Food</text>
      </g>
      <g class="node" transform="translate(660, 380)">
        <rect x="0" y="0" width="160" height="60" />
        <text x="80" y="25" text-anchor="middle" >Serve Node</text>
        <text x="80" y="40" class="sub" text-anchor="middle" >Deliver Food</text>
      </g>

      <!-- Edges -->
      <g class="edge">
        <!-- Client to Graph State -->
        <path d="M 240 300 L 300 300 L 300 230 L 360 230" marker-end="url(#arrow)" />

        <!-- State to Brain -->
        <path d="M 440 260 L 440 340" marker-end="url(#arrow)" />
        
        <!-- Brain to Tools -->
        <path d="M 520 370 L 580 370 L 580 190 L 660 190" marker-end="url(#arrow)" />
        <path d="M 520 370 L 580 370 L 580 300 L 660 300" marker-end="url(#arrow)" />
        <path d="M 520 370 L 580 370 L 580 410 L 660 410" marker-end="url(#arrow)" />

        <!-- Failure Handling (return to Brain) -->
        <path d="M 660 210 L 620 210 L 620 350 L 520 350" marker-end="url(#arrow)" stroke-dasharray="4,3" />
        <path d="M 660 320 L 640 320 L 640 390 L 520 390" marker-end="url(#arrow)" stroke-dasharray="4,3" />
      </g>
    </svg>
  </div>
</body>
</html>
